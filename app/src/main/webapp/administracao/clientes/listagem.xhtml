<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
	  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	  xmlns:f="http://xmlns.jcp.org/jsf/core"
	  xmlns:p="http://primefaces.org/ui"
	  xmlns:jsf="http://xmlns.jcp.org/jsf">

<ui:composition template="/_template.xhtml">

	<ui:define name="titulo">Clientes Cadastrados</ui:define>

	<ui:define name="conteudo">

        <p:fieldset legend="Administração / Clientes / Listagem" >

            <p:dataTable id="clientes" value="#{listaClientesBean.clientes}" var="cliente" scrollable="true" scrollRows="10" scrollHeight="400" liveScroll="false" >

                <p:column>
                    <f:facet name="header">
                        <h:outputLabel style="margin-right: 5px" styleClass="pi pi-heart" />
                        <h:outputLabel value="Cliente" />
                    </f:facet>
                    <p:outputLabel value="#{cliente.nome}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputLabel style="margin-right: 5px" styleClass="pi pi-info" />
                        <h:outputLabel value="Descrição" />
                    </f:facet>
                    <p:outputLabel value="#{cliente.descricao}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputLabel style="margin-right: 5px" styleClass="pi pi-envelope" />
                        <h:outputLabel value="Email(s)" />
                    </f:facet>
                    <p:outputLabel value="#{cliente.emails}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputLabel style="margin-right: 5px" styleClass="pi pi-phone" />
                        <h:outputLabel value="Número(s) para contato" />
                    </f:facet>
                    <p:outputLabel value="#{cliente.numerosParaContato}" />
                </p:column>

                <p:column style="cursor: default">
                    <f:facet name="header">
                        <h:outputLabel style="margin-right: 5px" styleClass="pi pi-clock" />
                        <h:outputLabel value="Horários" />
                    </f:facet>
                    <p>Expediente: #{cliente.horarios.horarioInicioDoExpediente} às #{cliente.horarios.horarioFimDoExpediente}</p>
                    <span jsf:rendered="#{cliente.horarios.possuiHorarioDeAlmoco}">Almoço: #{cliente.horarios.inicioDoHorarioDeAlmoco} às #{cliente.horarios.fimDoHorarioDeAlmoco}</span>
                </p:column>

                <p:column>
                    <f:facet name="header">
                      <h:outputLabel style="margin-right: 5px" styleClass="pi pi-trash" />
                      <h:outputLabel value="Excluir" />
                    </f:facet>
                    <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#clienteModal#{cliente.id}">Excluir</button>
                    <div class="modal fade" id="clienteModal#{cliente.id}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                      <div class="modal-dialog">
                        <div class="modal-content">
                          <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Confirmação de Exclusão</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                          </div>
                          <div class="modal-body">
                            <label>Confirmar Exclusão do Cliente: <span style="text-transform: capitalize; font-weight: bold;">#{cliente.nome}</span> ?</label>
                          </div>
                          <div class="modal-footer">
                            <h:form>
                              <h:commandButton value="Confirmar Exclusão" action="#{listaClientesBean.excluirCliente(cliente)}" styleClass="btn btn-danger" />
                            </h:form>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                          </div>
                        </div>
                      </div>
                    </div>
                </p:column>

            </p:dataTable>

        </p:fieldset>

	</ui:define>

</ui:composition>

</html>
