<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" >

<ui:composition template="/_template.xhtml">

    <ui:define name="titulo">Cadastro de Modelo de Email</ui:define>

    <ui:define name="conteudo">

        <p:fieldset legend="Administração / Emails / Cadastro" >
            <p:focus for=":form-cadastroEmailPronto" />

            <h:form id="form-cadastroEmailPronto" >
            <p:fieldset legend="Cadastro de Email Pronto (Tipo Template)">
                <p:panelGrid id="panel" columns="2" layout="flex" style="width: 100%" >
                    <h:outputLabel for="inputText-descricaoDoEmailTemplate" value="Descrição do Tipo do E-mail: " />
                    <h:inputText id="inputText-descricaoDoEmailTemplate" value="#{cadastroEmailTemplateBean.email.descricao}" styleClass="form-control" pt:placeholder="Email Pronto para quando acontecer o problema X ..." />

                    <h:outputLabel for="inputText-assuntoDoEmailTemplate" value="Assunto do E-mail: " />
                    <h:inputText id="inputText-assuntoDoEmailTemplate" value="#{cadastroEmailTemplateBean.email.assunto}" pt:oninput="imprimeAssuntoTemplateNoInputTextResultado()" styleClass="form-control" pt:placeholder="Solicitação de $problema.tipo no equipamento do fornecedor $fornecedor.nome " />

                    <h:outputLabel value="Corpo do Email: " for="textArea-corpoDoEmailTemplate" />
                    <h:inputTextarea id="textArea-corpoDoEmailTemplate" styleClass="form-control" pt:oninput="imprimeTemplateNoTextAreaResultado()" value="#{cadastroEmailTemplateBean.email.corpoDoEmail}" rows="10" cols="50" pt:placeholder="Prezado atendente da $fornecedor.nome, solicitamos garantia para o equipamento $numeroDeSerie..." />

                    <h:outputLabel value="Digite nos campos, assunto e corpo do e-mail, acima para ir conferindo o resultado logo abaixo" />
                    <br/>

                    <h:outputLabel value="Assunto do Email (Resultado)" />
                    <input id="inputText-resultado-assuntoDoEmailTemplate" placeholder="Digite no campo de Assunto do Email acima para ir conferindo o resultado neste campo" readonly="true" class="form-control" style="cursor: not-allowed;" />
                    <h:outputLabel for="textArea-resultado-corpoDoEmailTemplate" value="Corpo do Email (Resultado)" />
                    <textarea id="textArea-resultado-corpoDoEmailTemplate" class="form-control" rows="10" cols="50" readonly="true" style="cursor: not-allowed;" />

                    <h:outputLabel value="Confira os resultados acima e em seguida, salve as alterações" />
                    <p:commandButton value="Salvar Alterações" >
                        <f:ajax execute="@form" listener="#{cadastroEmailTemplateBean.cadastrar}" render=":mensagens inputText-descricaoDoEmailTemplate inputText-assuntoDoEmailTemplate textArea-corpoDoEmailTemplate " />
                    </p:commandButton>
                </p:panelGrid>
            </p:fieldset>
            </h:form>

            <p:fieldset legend="Variáveis Disponíveis" >
                <p>
                    Você pode utilizar as variáveis abaixo para gerar <i>um corpo de e-mail template</i>, que pode ser reaproveitado para várias solicitações ou fornecedores.
                </p>
                <ul style="list-style: none;">
                    <li>Número de Série do Equipamento: $numeroDeSerie</li>
                    <li>Tipo do Problema: $problema.tipo</li>
                    <li>Descrição Detalhada do Problema do Equipamento: $problema.descricao</li>
                    <li>Número do Ticket no Sistema de Chamado: $chamado.numeroDoTicket</li>
                    <li>Nome do Fornecedor: $fornecedor.nome</li>
                    <li>Nome do Cliente: $cliente.nome</li>
                    <li>Números para contato do Cliente: $cliente.numerosParaContato</li>
                    <li>Emails para contato do Cliente: $cliente.emailsParaContato</li>
                    <li>Endereço do Cliente: Rua ou Avenida: $cliente.endereco.logradouro</li>
                    <li>Endereço do Cliente: Número: $cliente.endereco.numero</li>
                    <li>Endereço do Cliente: Bairro: $cliente.endereco.bairro</li>
                    <li>Endereço do Cliente: Estado: $cliente.endereco.estado</li>
                    <li>Endereço do Cliente: Cidade: $cliente.endereco.cidade</li>
                    <li>Endereço do Cliente: CEP: $cliente.endereco.cep</li>
                    <li>Horários do Cliente: Início do Expediente: $cliente.horarios.inicioDoExpediente</li>
                    <li>Horários do Cliente: Início do Almoço: $cliente.horarios.inicioDoAlmoco</li>
                    <li>Horários do Cliente: Início do Fim: $cliente.horarios.fimDoAlmoco</li>
                    <li>Horários do Cliente: Fim do Expediente: $cliente.horarios.fimDoExpediente</li>
                </ul>

                <h2>Exemplo</h2>
                <p>
                    Abaixo é possível conferir como ficaria um cadastro de um email modelo
                </p>
                <h5>Assunto</h5>
                <p>
                    [Ticket#$chamado.numeroDoTicket] Problema $problema.tipo $fornecedor.nome - $cliente.nome
                </p>
                <h5>Corpo do E-mail</h5>
                <p>
                    Prezados, <br/>
                    Falamos da $cliente.nome, <br/>
                    Segue em anexo o formulário preenchido para abertura de solicitação de garantia para o equipamento: $numeroDeSerie. <br/>
                    O Expediente vai das $cliente.horarios.inicioDoExpediente às $cliente.horarios.fimDoExpediente. <br/>
                    Atenciosamente, <br/>
                    $cliente.nome - $cliente.descricao <br/>
                    $cliente.endereco.logradouro <br/>
                    $cliente.endereco.estado / $cliente.endereco.cidade <br/>
                </p>

                <h2>Resultado</h2>

                <h5>Assunto</h5>
                <p>
                    [Ticket#20240101486] Problema Mouse Fornecedor LTDA - Empresa Cliente Inc
                </p>
                <h5>Corpo do E-mail</h5>
                <p>
                    Prezados, <br/>
                    Falamos da Empresa Cliente LTDA, <br/>
                    Segue em anexo o formulário preenchido para abertura de solicitação de garantia para o equipamento: AVCL486XPTO. <br/>
                    O Expediente vai das 08:00 às 17:00. <br/>
                    Atenciosamente, <br/>
                    Empresa Cliente LTDA - Matriz da Empresa Cliente LTDA <br/>
                    Avenida dos Expedicionários <br/>
                    Ceará / Fortaleza <br/>
                </p>
            </p:fieldset>

        </p:fieldset>
    <script type="text/javascript" async="true" src="#{request.contextPath}/resources/js/administracao/emailstemplates/main.js"></script>
    <script type="text/javascript" async="true" src="#{request.contextPath}/resources/js/administracao/emailstemplates/cadastro.js"></script>
    </ui:define>
</ui:composition>
</html>
