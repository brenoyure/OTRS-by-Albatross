<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/_template.xhtml">

    <ui:define name="titulo">Listagem dos Emails Prontos</ui:define>

    <ui:define name="conteudo">

        <p:fieldset legend="Administração / Emails / Listagem">
            <h:form id="form-cadastroEmailPronto">

            <p:fieldset legend="Templates Cadastrados">
                <p:dataTable value="#{listaEmailsTemplateBean.emails}" var="email" >
                    
	                <p:column>
	                    <f:facet name="header">
	                        <h:outputLabel value="Descrição" />
	                        <h:outputLabel style="margin-left: 5px" styleClass="pi pi-exclamation-circle" />
	                    </f:facet>
	                    <p:outputLabel value="#{email.descricao}" />
	                </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputLabel value="Assunto" />
                            <h:outputLabel style="margin-left: 5px" styleClass="pi pi-exclamation-circle" />
                        </f:facet>
                        <p:outputLabel value="#{email.assunto}" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputLabel value="Corpo do E-mail" />
                            <h:outputLabel style="margin-left: 5px" styleClass="pi pi-exclamation-circle" />
                        </f:facet>
                        <p:outputLabel value="#{email.corpoDoEmail}" />
                    </p:column>

                </p:dataTable>
            </p:fieldset>
            </h:form>
        </p:fieldset>
    </ui:define>
</ui:composition>
</html>
