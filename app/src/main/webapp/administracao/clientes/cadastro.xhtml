<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/_template.xhtml" >

    <ui:define name="titulo">Cadastrado de Cliente</ui:define>

    <ui:define name="conteudo">

        <p:fieldset legend="Administração / Clientes / Cadastro" >
        <p:focus for=":form-cadastroCliente:panel" />

            <h:form id="form-cadastroCliente" >

                <p:panelGrid id="panel" columns="2" layout="tabular" >

                    <p:outputLabel for="@next" value="Nome: "/>
                    <p:inputText id="inputText-clienteNome" value="#{cadastroClienteBean.dadosParaCadastro.nome}" />

                    <p:outputLabel value="Finalizar Cadastro: "/>
                    <p:commandButton value="Cadastrar" action="#{cadastroClienteBean.cadastrarCliente()}" ajax="false" />

                </p:panelGrid>
                
            </h:form>

        </p:fieldset>
        
    </ui:define>

</ui:composition>


</html>
