<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<f:metadata>
    <f:viewParam  name="clienteId" />
    <f:viewAction action="#{atualizacaoClienteBean.carregarClientePeloId(param.clienteId)}" if="#{param.clienteId != null}" />
</f:metadata>

<ui:composition template="/_template.xhtml" >

    <ui:define name="titulo">Atualização Cadastral de Cliente</ui:define>

    <ui:define name="conteudo">

        <p:fieldset legend="Administração / Clientes / Atualização" >
        <p:focus for=":form-cadastroCliente:panel" />

            <h:form id="form-cadastroCliente" >

                <p:fieldset legend="Cliente">
	                <p:panelGrid id="panel" columns="2" layout="tabular" >
	
	                    <p:outputLabel for="@next" value="Nome: "/>
	                    <p:inputText id="inputText-nome" value="#{atualizacaoClienteBean.dadosParaCadastro.nome}" maxlength="100" required="true" requiredMessage="Nome do Cliente é Obrigatório" size="100" />
	
	                    <p:outputLabel for="@next" value="Descrição: " />
	                    <p:inputText id="inputText-descricao" value="#{atualizacaoClienteBean.dadosParaCadastro.descricao}" maxlength="255" required="true" requiredMessage="Forneça uma Descrição é Obrigatório" size="100" />
	
	                    <p:outputLabel for="@next" value="Número(s) para contato: " />
	                    <p:inputText id="inputText-numerosParaContato" value="#{atualizacaoClienteBean.dadosParaCadastro.numerosParaContato}" maxlength="100" size="100" />
	
	                    <p:outputLabel for="@next" value="Email(s) para contato: " />
	                    <p:inputText id="inputText-emailsParaContato" value="#{atualizacaoClienteBean.dadosParaCadastro.emailsParaContato}" size="100" />
	
	                </p:panelGrid>
                </p:fieldset>

                <p:fieldset legend="Dados de Endereço" >
	                <p:panelGrid id="panel-endereco" columns="2" layout="tabular" >

	                    <p:outputLabel value="Rua / Avenida: ">
	                       <p:inputText id="inputText-logradouro" value="#{atualizacaoClienteBean.dadosParaCadastro.logradouro}" maxlength="100" size="50" />
	                    </p:outputLabel>

                        <p:outputLabel value="Número: ">
                            <p:inputText id="inputText-numero" value="#{atualizacaoClienteBean.dadosParaCadastro.numero}" maxlength="55" size="10" />
                        </p:outputLabel>

                        <p:outputLabel value="Bairro: ">
                            <p:inputText id="inputText-bairro" value="#{atualizacaoClienteBean.dadosParaCadastro.bairro}" maxlength="55" size="50" />
                        </p:outputLabel>

                        <p:outputLabel value="Estado: ">
                            <p:inputText id="inputText-estado" value="#{atualizacaoClienteBean.dadosParaCadastro.estado}" maxlength="55" />
                        </p:outputLabel>

                        <p:outputLabel value="Cidade: ">
                            <p:inputText id="inputText-cidade" value="#{atualizacaoClienteBean.dadosParaCadastro.cidade}" maxlength="55" size="30" />
                        </p:outputLabel>

                        <p:outputLabel value="CEP: ">
                            <p:inputText id="inputText-cep" value="#{atualizacaoClienteBean.dadosParaCadastro.cep}" maxlength="13" />
                        </p:outputLabel>
	                    
	                </p:panelGrid>
                </p:fieldset>

                <p:fieldset legend="Horários">
                    <p:panelGrid id="panel-horarios" columns="2" layout="tabular" >

                        <p:outputLabel value="Início do Expediente:">
                            <p:inputText id="inputText-horarioInicioDoExpediente" type="time" value="#{atualizacaoClienteBean.dadosParaCadastro.horarioInicioDoExpediente}" required="true" requiredMessage="É necessário informar o horário de início do expediente" styleClass="form-control" >
                                <f:convertDateTime pattern="HH:mm" type="localTime" timeZone="America/Fortaleza" />
                            </p:inputText>
                        </p:outputLabel>

                        <p:outputLabel value="Fim do Expediente:">
                            <p:inputText id="inputText-horarioFimDoExpediente" type="time" value="#{atualizacaoClienteBean.dadosParaCadastro.horarioFimDoExpediente}" required="true" requiredMessage="É necessário informar o horário do fim do expediente" styleClass="form-control" >
                                <f:convertDateTime pattern="HH:mm" type="localTime" timeZone="America/Fortaleza" />
                            </p:inputText>
                        </p:outputLabel>

                        <p:outputLabel for="@next" value="Possui Horário de Almoço?" />
                        <h:selectBooleanCheckbox id="selectBoolean-possuiHorarioDeAlmoco" onchange="showOrHideHorariosDeAlmoco()" value="#{atualizacaoClienteBean.dadosParaCadastro.possuiHorarioDeAlmoco}" required="true" requiredMessage="É necessário informar se o cliente (órgão ou empresa, possui horário de almoço)" />

                        <p:outputLabel value="Início do Horário de Almoço: ">
                            <h:inputText id="inputText-inicioDoHorarioDeAlmoco" type="time" value="#{atualizacaoClienteBean.dadosParaCadastro.inicioDoHorarioDeAlmoco}" styleClass="form-control" >
                                <f:convertDateTime pattern="HH:mm" type="localTime" timeZone="America/Fortaleza" />
                            </h:inputText>
                        </p:outputLabel>

                        <p:outputLabel value="Fim do Horário de Almoço: ">
                            <h:inputText id="inputText-fimDoHorarioDeAlmoco" type="time" value="#{atualizacaoClienteBean.dadosParaCadastro.fimDoHorarioDeAlmoco}" styleClass="form-control" >
                                <f:convertDateTime pattern="HH:mm" type="localTime" timeZone="America/Fortaleza" />
                            </h:inputText>
                        </p:outputLabel>

                    </p:panelGrid>
                </p:fieldset>

                <p:commandButton value="Cadastrar" actionListener="#{atualizacaoClienteBean.atualizarCadastro()}" update="@form :mensagens" />

            </h:form>

        </p:fieldset>

	    <script type="text/javascript" >

	    const checkBoxPossuiHorarioDeAlmoco = document.getElementById('form-cadastroCliente:selectBoolean-possuiHorarioDeAlmoco');
	    const inputInicioDoHorarioDeAlmoco = document.getElementById('form-cadastroCliente:inputText-inicioDoHorarioDeAlmoco');
	    const inputFimDoHorarioDeAlmoco = document.getElementById('form-cadastroCliente:inputText-fimDoHorarioDeAlmoco');

	    if (!checkBoxPossuiHorarioDeAlmoco.checked) {
	        inputInicioDoHorarioDeAlmoco.hidden = true;
	        inputFimDoHorarioDeAlmoco.hidden = true;
		}

	    function showOrHideHorariosDeAlmoco() {

	        let inicioDoHorarioDeAlmoco = inputInicioDoHorarioDeAlmoco.value;
	        let fimDoHorarioDeAlmoco = inputFimDoHorarioDeAlmoco.value;

	        if (checkBoxPossuiHorarioDeAlmoco.checked) {

	        	inputInicioDoHorarioDeAlmoco.hidden = false;

	            inputFimDoHorarioDeAlmoco.hidden = false;

	            return;
		    }

	        inputInicioDoHorarioDeAlmoco.hidden = true;
	        inputFimDoHorarioDeAlmoco.hidden = true;

		}
   
	    </script>
        
    </ui:define>

</ui:composition>


</html>
