<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/_template.xhtml">

    <ui:define name="titulo">Listagem dos Emails Prontos</ui:define>

    <ui:define name="conteudo">

        <p:fieldset legend="Administração / Modelos de Emails / Listagem" >
            <h:form id="form-tableEmails">

            <p:fieldset legend="Modelos Cadastrados">
                <p:dataTable id="dataTable-emails" value="#{listaEmailsTemplateBean.emails}" var="email" style="cursor: pointer" >

	                <p:column >
	                    <f:facet name="header">
	                        <h:outputLabel value="Descrição" />
	                        <h:outputLabel style="margin-left: 5px;" styleClass="pi pi-exclamation-circle" />
	                    </f:facet>
	                    <p:outputLabel value="#{email.descricao}" />
	                </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputLabel value="Assunto" />
                            <h:outputLabel style="margin-left: 5px" styleClass="pi pi-exclamation-circle" />
                        </f:facet>
                        <p:outputLabel value="#{email.assunto}" />
                    </p:column>

                   <p:column>
                       <f:facet name="header">
                           <h:outputLabel style="margin-right: 5px" styleClass="pi pi-exclamation-circle" />
                           <h:outputLabel value="Informações" />
                       </f:facet>
                       <p:link outcome="/administracao/emailstemplates/atualizacao" includeViewParams="true" >
                           <h:outputText title="Informações" value="Informações" styleClass="btn btn-secondary" />
                           <f:param name="emailId" value="#{email.id}" />
                       </p:link>
                   </p:column>

                </p:dataTable>
            </p:fieldset>
            </h:form>
        </p:fieldset>
    <script type="text/javascript" async="true" src="#{request.contextPath}/resources/js/administracao/emailstemplates/main.js"></script>
    <script type="text/javascript" async="true" src="#{request.contextPath}/resources/js/administracao/emailstemplates/listagem.js"></script>
    </ui:define>
</ui:composition>
</html>
