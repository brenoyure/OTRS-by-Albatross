<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
	  xmlns:p="http://primefaces.org/ui"
	  xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition>

    <nav>
        <h:form style="margin:10px 0 10px 0">
            <p:menubar autoDisplay="true">
                <p:menuitem  value="Serviço de Garantia"            icon="pi pi-wrench"             outcome="/otrs"                                                                                   />

                <p:submenu label="Textos Prontos"                   icon="pi pi-align-left"                                                           disabled="#{not request.isUserInRole('ADMIN')}"  >
                    <p:menuitem  value="Problemas"                  icon="pi pi-question"           outcome="/administracao/problemas"                                                                />
                    <p:submenu label="Modelos de Emails "           icon="pi pi-inbox"                                                                                                                 >
                        <p:menuitem value="Novo"                    icon="pi pi-plus-circle"        outcome="/administracao/emailstemplates/cadastro"                                                 />
                        <p:menuitem value="Listagem"                icon="pi pi-list-check"         outcome="/administracao/emailstemplates/listagem"                                                 />
                    </p:submenu>
                </p:submenu>

	            <p:submenu label="Usuários"                         icon="pi pi-fw pi-user"                                                           disabled="#{not request.isUserInRole('ADMIN')}"  >
	                <p:menuitem value="Novo"                        icon="pi pi-fw pi-user-plus"    outcome="/administracao/usuarios/cadastro"                                                        />
	                <p:menuitem value="Listagem"                    icon="pi pi-fw pi-users"        outcome="/administracao/usuarios/listagem"                                                        />
	            </p:submenu>

                <p:submenu label="Fornecedores"                     icon="pi pi-truck"                                                                disabled="#{not request.isUserInRole('ADMIN')}"  >
                    <p:menuitem value="Novo"                        icon="pi pi-plus-circle"        outcome="/administracao/fornecedores/cadastro"                                                    />
                    <p:menuitem value="Listagem"                    icon="pi pi-list-check"         outcome="/administracao/fornecedores/listagem"                                                    />
                </p:submenu>

                <p:submenu label="Clientes" icon="pi pi-building"                                                                                     disabled="#{not request.isUserInRole('ADMIN')}"  >
                    <p:menuitem  value="Novo"                       icon="pi pi-plus-circle"        outcome="/administracao/clientes/cadastro"                                                        />
                    <p:menuitem  value="Listagem"                   icon="pi pi-list-check"         outcome="/administracao/clientes/listagem"                                                        />
                </p:submenu>

                <p:menuitem  value="Relatórios dos Serviços"        icon="pi pi-history"            outcome="/administracao/solicitacoes/listagem"                                                    />

	            <f:facet name="options">
                    <h:outputLabel   value="Olá, você está logado como Administrador"  style="margin-right: 10px;"                             rendered="#{request.userPrincipal.name.equals('Administrador')}"     />
                    <h:outputLabel   value="Olá #{request.userPrincipal.name}"         style="text-transform:capitalize ;margin-right: 10px;"  rendered="#{not request.userPrincipal.name.equals('Administrador')}" />
                    <p:commandButton value="Sair" icon="pi pi-power-off" action="#{logoutBean.logout}" />
	            </f:facet>
            </p:menubar>
        </h:form>
    </nav>

</ui:composition>

</html>
