<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:jsf="http://xmlns.jcp.org/jsf">

<ui:composition template="/_template.xhtml">

    <ui:define name="titulo">
        Serviço de Garantia
    </ui:define>

    <ui:define name="conteudo">

	    <h:form id="formulario-email-garantia" enctype="multipart/form-data">

	    <p:focus context="panel" />

	        <p:fieldset legend="Serviço de Garantia" collapsed="false" toggleable="true" > 
	                <p:panelGrid columns="2" id="panel" layout="grid" >

                        <p:outputLabel for="selectOne-Fornecedor" value="Selecione o Fornecedor" />
                        <p:selectOneMenu id="selectOne-Fornecedor" value="#{otrsBean.fornecedorSelecionado}" required="true" requiredMessage="É Obrigatório informar para qual fornecedor será a Solicitação de Garantia" converter="fornecedorConverter" >
                            <f:selectItem itemLabel="Selecione o Fornecedor" noSelectionOption="true" />
                            <f:selectItems value="#{listaFornecedoresBean.fornecedores}" var="fornecedor" itemValue="#{fornecedor}" itemLabel="#{fornecedor.nome}" />
                            <f:ajax event="change" listener="#{otrsBean.listarChamadosComOServicoDoFornecedor()}" render=":mensagens selectOne-Ticket inputText-EmailDestino" />
                        </p:selectOneMenu>

	                    <p:outputLabel for="inputText-BM" value="(Opcional) Buscar Número de Série pelo BM ou SIADS: " />
	                        <p:inputText id="inputText-BM" value="#{otrsBean.bm}" maxlength="10" placeholder="(Opcional) BM ou SIADS" >
	                            <f:ajax event="change" execute="@this" render="inputText-NumeroDeSerie :mensagens" listener="#{otrsBean.buscarNumeroDeSeriePeloBm}" />
	                        </p:inputText>

	                    <p:outputLabel for="inputText-NumeroDeSerie" value="Nº de Série: " />
	                        <p:inputText id="inputText-NumeroDeSerie" required="true" requiredMessage="Nº de Série Obrigatório" value="#{otrsBean.solicitacao.numeroDeSerie}" placeholder="Nº de Série" >
	                            <f:ajax event="change" render="@this :mensagens" />
	                        </p:inputText>

                        <p:outputLabel value="Problema: " for="selectOne-DescricaoProblema" />
                        <p:outputLabel value="Nenhum Texto Pronto Cadastrado" rendered="#{empty listaDescricaoProblemasBean.problemasDisponiveis}" />
                        <p:selectOneMenu id="selectOne-DescricaoProblema" value="#{otrsBean.solicitacao.descricaoDoProblema}" required="true" requiredMessage="Descrição do Problema Obrigatória" rendered="#{not empty listaDescricaoProblemasBean.problemasDisponiveis}" converter="descricaoProblemaConverter" >
                            <f:selectItem itemLabel="Selecione o Problema" itemDisabled="false" noSelectionOption="true" />
                            <f:selectItems var="problema" value="#{listaDescricaoProblemasBean.problemasDisponiveis}" itemLabel="#{problema.problema.tipo} - #{problema.descricaoResumida}" itemDescription="#{problema.descricaoDetalhada}" itemValue="#{problema}" />
                            <f:ajax event="change" render=":mensagens @this textArea-DescricaoProblema" />
                        </p:selectOneMenu>

                        <p:outputLabel for="selectOne-Ticket" value="Ticket: " /> 
                        <p:selectOneMenu id="selectOne-Ticket" value="#{otrsBean.solicitacao.chamado}" required="true" requiredMessage="Ticket Obrigatório" converter="ticketConverter" >
                            <f:selectItem itemLabel="Selecione um Ticket" itemDisabled="true" noSelectionOption="true" />
                            <f:selectItems value="#{otrsBean.chamadosDisponiveis}" var="ticket" itemLabel="Nº: #{ticket.numeroDoChamado} | Título: #{ticket.titulo} | Serviço: #{ticket.dadosDoServico.nomeDoServico} | Usuário: #{ticket.dadosDoUsuarioCliente.nomeDoUsuarioCliente}" itemValue="#{ticket}" />
                            <f:ajax event="change" listener="#{otrsBean.definirAssuntoDoEmail}" render=":mensagens outputText-Assunto" />
	                    </p:selectOneMenu>       

                        <p:outputLabel for="outputText-Assunto" value="Assunto: " />
                        <p:outputLabel id="outputText-Assunto" value="#{otrsBean.solicitacao.emailDeGarantia.assunto}" size="#{otrsBean.solicitacao.emailDeGarantia.assunto.length()}" />

	                    <p:outputLabel for="textArea-DescricaoProblema" value="Descrição do Problema" />
	                    <p:inputTextarea id="textArea-DescricaoProblema" value="#{otrsBean.solicitacao.descricaoDoProblema.descricaoDetalhada}" readonly="true" rows="6" cols="33" placeholder="Computador/Monitor está apresentando problema de..."  autoResize="false" required="true" requiredMessage="Descrição do Problema Obrigatória" />

	                    <p:outputLabel value="Adicionar Vídeo ou Foto do Problema (Máx: 10MB)" for="fileUpload" />
	                    <h:inputFile id="fileUpload" styleClass="form-control" value="#{otrsBean.uploadedFile}" required="false" >
	                        <f:ajax execute="@this" render=":mensagens" />
	                    </h:inputFile>

	                    <br />

	                </p:panelGrid>
	        </p:fieldset>
	        
            <p:fieldset legend="Dados do Envio" collapsed="false" toggleable="true" >
                <p:panelGrid layout="flex" columns="2" >
                        <p:outputLabel for="inputText-EmailRemetente" value="E-mail do Remetente: ">
                            <p:inputText id="inputText-EmailRemetente" placeholder="email.do.atendente@empresa.br" type="email" value="#{otrsBean.solicitacao.emailDeGarantia.dadosDoEnvio.remetente}" required="true" requiredMessage="E-mail do Remetente é Obrigatório." size="50" >
                                <f:ajax event="input" execute="@this" render="@this :mensagens" />
                            </p:inputText>
                        </p:outputLabel>

                        <p:outputLabel for="inputText-EmailDestino" value="E-mail(s) de Destino(s): ">
                            <p:inputText id="inputText-EmailDestino" placeholder="suporte.fabricante@empresa.br" type="email" value="#{otrsBean.solicitacao.emailDeGarantia.dadosDoEnvio.destinatario}" required="true" requiredMessage="E-mail de Destino Obrigatório." size="50" >
                                <f:ajax event="input" execute="@this" render="@this :mensagens" />
                            </p:inputText>
                        </p:outputLabel>

                        <p:outputLabel for="inputText-EmailCopia" value="(Opcional) Cópia para: ">
                            <p:inputText id="inputText-EmailCopia" type="email" value="#{otrsBean.solicitacao.emailDeGarantia.dadosDoEnvio.copiaPara}" size="50" >
                                <f:ajax event="input" execute="@this" render="@this" />
                            </p:inputText>
                        </p:outputLabel>
                </p:panelGrid>
            </p:fieldset>

            <p:commandButton 
                id="commandButton-submit"
                type="submit" 
                value="Enviar Solicitação" 
                update=":mensagens @form" 
                actionListener="#{otrsBean.enviarSolicitacaoDeGarantiaPorEmail}" 
                style="margin:10px 5px 10px 10px;" 
            />
            <p:commandButton value="Limpar Formulário" action="otrs?faces-redirect=true" immediate="true" update="@all" style="margin-top:10px" />

	        <br />

	    </h:form>

	    <script type="text/javascript" >

			async function sayHello() {
			
			    let select = document.getElementById("formulario-email-garantia:selectOne-DescricaoProblema");
			
			    let descricaoProblemaId = select.value
			
			    if (descricaoProblemaId == '') {
			        setTextAreaDescricaoProblemaText('')
			        return
			    }

			    await definirTextoDoTextAreaDescricaoProblema(descricaoProblemaId)

			};

			async function definirTextoDoTextAreaDescricaoProblema(descricaoProblemaId) {
			
			    let problemasEndPoint = "#{request.contextPath}" + "/api/problemas/" + descricaoProblemaId;
			
			    await fetch(problemasEndPoint).then(response => {
			
			        response
			            .json()
			            .then((data) => {
			
			                setTextAreaDescricaoProblemaText(data.descricaoDetalhada);
			
			            })
			
			    })
			
			}

			async function setTextAreaDescricaoProblemaText(text) {
			    let textAreaProblema = document.getElementById('formulario-email-garantia:textArea-DescricaoProblema')
			    textAreaProblema.innerHTML = text
			}

	    </script>

    </ui:define>

</ui:composition>

</html>
